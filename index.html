<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a5c;--blue:#2563eb;--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mu:#5b6b88;--ln:#e1e8f2;--ok:#15803d;--wa:#b45309;--er:#dc2626;--okb:#dcfce7;--wab:#fef3c7;--erb:#fee2e2;--sel:#e8f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--card:#121f3a;--tx:#e6ecf8;--mu:#94a3c4;--ln:#243558;--sel:#1b2f5c;--okb:#12351f;--wab:#3b2c0a;--erb:#3d1414;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}

main{min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--ln)}

.ct{padding:20px 24px;display:grid;gap:16px}.ct>h2{font-size:19px;margin:0}.ct>*{min-width:0}.app.sc{grid-template-columns:1fr}.app.sc aside{display:none}.cr{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin:6px 0}

select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;color:var(--tx)}

.kpi b{display:block;font-size:25px;line-height:1.2}.kpi span{display:block;font-size:12.5px;font-weight:600}.kpi small{color:var(--mu);font-size:11.5px}
.kpi.er b{color:var(--er)}.kpi.wa b{color:var(--wa)}.kpi.ok b{color:var(--ok)}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13.5px;margin:14px 0 6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}

tr.cl{cursor:pointer}tr.cl:hover{background:var(--sel)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.p-ok{background:var(--okb);color:var(--ok)}.p-wa{background:var(--wab);color:var(--wa)}.p-er{background:var(--erb);color:var(--er)}.p-mu{background:var(--sel);color:var(--blue)}
.hb{display:grid;grid-template-columns:130px 1fr 92px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.tr{height:12px;background:var(--sel);border-radius:6px;overflow:hidden}.tr i{display:block;height:100%;background:var(--blue)}
.ai li{margin:7px 0}a.l{color:var(--blue);cursor:pointer;text-decoration:underline}
.note{color:var(--mu);font-size:12.5px}.empty{text-align:center;padding:40px 10px;color:var(--mu)}
dialog{border:0;border-radius:12px;padding:20px;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}dialog input:not([type=file]),dialog select,dialog textarea{width:100%}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}#toast.e{background:var(--er)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto}nav{display:flex;overflow-x:auto;gap:4px;align-items:center}nav button{white-space:nowrap;width:auto}.ng{display:none}.ct,.top,.ban{padding-left:14px;padding-right:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');
:root{--bg:#f3f6fb;--card:#fff;--tx:#1e293b;--mu:#64748b;--ln:#e2e8f0;--sel:#eaf1fe;--blue:#2563eb;--navy:#0f2547}
aside{background:linear-gradient(180deg,#0f2547,#15356d)}.logo{font-size:18px;letter-spacing:.2px}

.top{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--ln)}.top h1{color:var(--navy)}
:root[data-theme="dark"] .top h1{color:var(--tx)}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(15,37,71,.05),0 6px 18px rgba(15,37,71,.04)}

button.kpi{position:relative;transition:transform .15s,border-color .15s}button.kpi:hover{transform:translateY(-2px)}

.hero{background:linear-gradient(120deg,#1d4ed8,#0ea5c6);color:#fff;border-radius:14px;padding:18px 22px}.hero b{font-size:18px}.hero small{display:block;opacity:.9;margin-top:2px}

:root{--navy:#0f2f3d;--blue:#0e8f8a;--bg:#eef4f4;--card:#fff;--tx:#14262e;--mu:#5d7079;--ln:#dbe5e5;--sel:#e3f3f2;--ok:#0e7a4b;--okb:#dcf5e8;--wa:#a8620a;--wab:#fdf0d2;--er:#c4392b;--erb:#fde4e0}

.kpis button.kpi:nth-child(4){--c:#0e8f56}.kpis button.kpi:nth-child(5){--c:#e5604d}.kpis button.kpi:nth-child(6){--c:#d98a0b}
.kpis button.kpi:nth-child(7){--c:#c4492f}.kpis button.kpi:nth-child(8){--c:#0e8f56}.kpis button.kpi:nth-child(9){--c:#7b5bd6}
.kpis button.kpi:nth-child(10){--c:#e5604d}.kpis button.kpi:nth-child(11){--c:#0e8f8a}.kpis button.kpi:nth-child(12){--c:#2f7fd1}
.kpis button.kpi:nth-child(13){--c:#5d7079}.kpis button.kpi:nth-child(14){--c:#d98a0b}

<div class="app">
<aside><div class="logo">EduManage AI<small>Quản lý chuyên môn đa điểm trường</small></div><nav id="nav"></nav></aside>
<main>
<div class="top"><button class="btn g" onclick="sb()" aria-label="Thu gọn hoặc mở menu">☰</button><div><h1>Trường Tiểu học Đỗ Thúc Tịnh</h1><p>Năm học 2026–2027 · Học kỳ I</p></div>
<div class="who"><select id="rl" onchange="role=this.value;selId=null;fl.to='';render()" aria-label="Xem thử theo vai trò"><option value="bgh">Xem thử: Ban giám hiệu</option><option value="tt">Xem thử: Tổ trưởng</option><option value="gv">Xem thử: Giáo viên</option><option value="ad">Xem thử: Quản trị</option></select><select id="tt2" aria-label="Tổ phụ trách" style="display:none" onchange="ttTo=this.value;fl.to='';selId=null;render()"></select>
<button class="btn g" onclick="bell()" aria-label="Thông báo">🔔 <span id="bc"></span></button><button class="btn g" onclick="window.print()" aria-label="In trang hiện tại">🖨</button><button class="btn g" onclick="theme()" aria-label="Đổi chế độ sáng/tối">◐</button>
<div><b id="un"></b><br><span class="note" id="ul"></span></div><div class="av" id="av"></div></div></div>
<div class="ban" id="ban"></div>
<div class="ct" id="v"></div></main></div>
<dialog id="dlg"></dialog>
<dialog id="cf"><p id="cm"></p><div class="bar"><span class="sp"></span><button class="btn g" onclick="$('cf').close()">Hủy</button><button class="btn" id="cy">Xác nhận</button></div></dialog>
<div id="toast" role="status"></div>
<script>
const KEY='edm-v3b',OLD='edm-none',TZ='Asia/Ho_Chi_Minh',BASE=Date.UTC(2026,8,21),PG=10;
const nowTs=()=>new Date().toLocaleString('sv-SE',{timeZone:TZ}),TODAY=nowTs().slice(0,10);
const wkOf=iso=>Math.floor((Date.parse(iso.slice(0,10))-BASE)/6048e5)+1,CW=wkOf(TODAY);
const SUB=['Đã nộp','Đang rà soát','Cần chỉnh sửa','Chờ duyệt','Đã duyệt','Từ chối'];
const ALLST=['Chưa nộp','Bản nháp','Đã nộp','Đang rà soát','Cần chỉnh sửa','Chờ duyệt','Đã duyệt','Từ chối','Thu hồi'];
const STC={'Đã duyệt':'ok','Chờ duyệt':'wa','Đang rà soát':'wa','Cần chỉnh sửa':'er','Từ chối':'er','Chưa nộp':'er'};
const TY=['Kế hoạch bài dạy','Kế hoạch giáo dục','Biên bản sinh hoạt','Phiếu dự giờ','Báo cáo chuyên môn'],TO=['Tổ khối 1–2','Tổ khối 3','Tổ khối 4–5'];
const AC={nop:['Đã nộp','Nộp hồ sơ'],thuhoi:['Thu hồi','Thu hồi hồ sơ'],ver:['Đã nộp','Nộp phiên bản mới'],rs:['Đang rà soát','Bắt đầu rà soát'],cho:['Chờ duyệt','Chuyển chờ duyệt'],duyet:['Đã duyệt','Phê duyệt'],sua:['Cần chỉnh sửa','Yêu cầu chỉnh sửa'],tc:['Từ chối','Từ chối hồ sơ']};
const R={bgh:{n:'Ngô Thị Bông',l:'Phó Hiệu trưởng'},tt:{n:'Trần Văn Hòa',l:'Tổ trưởng chuyên môn'},gv:{n:'Nguyễn Thị Lan',l:'Giáo viên',tid:'GV001'},ad:{n:'Quản trị hệ thống',l:'Quản trị viên',av:'QT'}};
const $=id=>document.getElementById(id),pc=(a,b)=>Math.round(a/b*100),fr=r=>r==null?'—':r+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cnt=(ds,s)=>ds.filter(d=>d.st==s).length,pill=(s,c)=>`<span class="pill p-${c||STC[s]||'mu'}">${esc(s)}</span>`;
const opt=(a,v)=>a.map(([k,l])=>`<option value="${esc(k)}"${k==v?' selected':''}>${esc(l)}</option>`).join('');

const CR=[["Yêu cầu cần đạt", "Ghi đúng yêu cầu cần đạt của bài theo chương trình, có cả phẩm chất, năng lực. Có yêu cầu cần đạt riêng đối với lớp có học sinh khuyết tật"], ["Đồ dùng dạy học", "Nêu rõ đồ dùng của giáo viên và học sinh, phù hợp hoạt động"], ["Hoạt động Khởi động", "Có mục tiêu, cách tổ chức, tạo hứng thú và kết nối bài mới"], ["Hoạt động hình thành kiến thức mới", "Học sinh tự khám phá, có hình thức tổ chức cụ thể (cá nhân, nhóm). Có thể hiện nhiệm vụ ngắn gọn với HSKT (nếu có)"], ["Hoạt động luyện tập, thực hành", "Bài tập bám yêu cầu cần đạt, có phân hoá học sinh. Có thể hiện nhiệm vụ ngắn gọn với HSKT (nếu có)"], ["Hoạt động vận dụng, trải nghiệm", "Liên hệ thực tế, đời sống của học sinh. Có thể hiện nhiệm vụ ngắn gọn với HSKT (nếu có)"], ["Đánh giá thường xuyên", "Có cách nhận xét, đánh giá học sinh trong tiết học theo Thông tư 27/2020"], ["Điều chỉnh sau bài dạy", "Có ghi điều chỉnh (nếu bài đã dạy)"], ["Tích hợp giáo dục địa phương, lồng ghép nội dung giáo dục AI, kĩ năng công dân số...", "Có ghi nội dung tích hợp, lồng ghép tại mục yêu cầu cần đạt, trước mục đồ dùng dạy học"]],PR="Vai trò: Bạn là tổ trưởng chuyên môn trường tiểu học, rà soát kế hoạch bài dạy (KHBD) theo Chương trình GDPT 2018 để góp ý nội bộ. Không chấm điểm, không xếp loại giáo viên.\n\nTHÔNG TIN DO TỔ TRƯỞNG ĐIỀN\n- Môn / lớp / bài: [điền]\n- Lớp có học sinh khuyết tật (HSKT): [Có / Không]\n- Bài đã dạy: [Đã dạy / Chưa dạy]\n\nBẢO MẬT: Nếu bài còn tên học sinh, giáo viên hoặc thông tin nhận dạng, thay bằng [tên] trong mọi phần trả lời.\n\n9 TIÊU CHÍ\n1. Yêu cầu cần đạt: đúng yêu cầu của bài, có phẩm chất, năng lực; nếu lớp có HSKT thì có yêu cầu riêng cho HSKT.\n2. Đồ dùng dạy học: nêu rõ của giáo viên và học sinh, phù hợp hoạt động.\n3. Hoạt động khởi động: có mục tiêu, cách tổ chức, tạo hứng thú, kết nối bài mới.\n4. Hoạt động hình thành kiến thức mới: học sinh tự khám phá, hình thức tổ chức cụ thể (cá nhân, nhóm); nếu có HSKT thì có nhiệm vụ ngắn gọn cho HSKT.\n5. Hoạt độ return`<div class="card"><h2>Quy trình rà soát có AI (thí điểm 29/10)</h2><ol><li>Tổ trưởng bấm <b>Sao chép câu lệnh rà soát</b>.</li><li>Mở Gemini bằng tài khoản Google của trường, dán câu lệnh rồi tải kế hoạch bài dạy lên (hoặc dán nội dung vào cuối câu lệnh).</li><li>Chọn hồ sơ trong danh sách bên dưới, dán nhận xét của Gemini vào phiếu rà soát.</li><li>Tổ trưởng đọc lại, tích Đạt/Chưa đạt từng tiêu chí, sửa chỗ AI sai rồi bấm <b>Xác nhận</b>. Có xác nhận mới gửi được nhận xét cho giáo viên.</li></ol><div class="bar"><input id="pm" placeholder="Môn / lớp / bài" oninput="pu()" style="flex:1;min-width:180px" aria-label="Môn, lớp, bài"><select id="ph" onchange="pu()" aria-label="Lớp có học sinh khuyết tật"><option value="">Lớp có HSKT?</option><option>Có</option><option>Không</option></select><select id="pd" onchange="pu()" aria-label="Bài đã dạy chưa"><option value="">Bài đã dạy?</option><option>Đã dạy</option><option>Chưa dạy</option></select></div><div class="bar"><button class="btn" onclick="cp()">Sao chép câu lệnh rà soát</button></div><p class="note">Điền 3 ô trên (nếu không điền, tổ trưởng điền tay trong Gemini) rồi sao chép.</p><details><summary>Xem câu lệnh</summary><textarea id="pt" readonly rows="10" style="width:100%">${esc(PR)}</textarea></details><p class="note">Web không tự gọi AI và không tạo nhận xét. AI chạy trong Gemini; web chỉ lưu kết quả do tổ trưởng dán vào, sửa và xác nhận.</p></div>
<div class="card"><h2>Bốn điều bắt buộc khi dùng (theo Quy tắc sử dụng AI của trường)</h2><ul><li>Chỉ dùng công cụ trong danh mục Hiệu trưởng đã phê duyệt (Điều 9).</li><li>Xóa tên học sinh, giáo viên, đồng nghiệp và thông tin nhận dạng khác trong bài trước khi tải lên (Điều 5, 10).</li><li>Tổ trưởng đọc lại toàn bộ kết quả, sửa chỗ AI sai rồi mới gửi giáo viên. Thời gian đọc và sửa được tính vào số phút “có AI” (Điều 3, 5, 11).</li><li>Ghi lại số nhận định AI sai: đây là số liệu chứng minh “AI có trách nhiệm”. Kết quả AI không dùng để chấm điểm hay xếp loại giáo viên (Điều 4).</li></ul></div>
<div class="card"><h2>Hồ sơ đang rà soát (${q.length})</h2>${q.length?`<div class="tw"><table><tr><th>Hồ sơ</th><th>Người nộp</th><th>Điểm trường</th><th>Phiếu rà soát</th></tr>${q.slice(0,15).map(d=>`<tr class="cl" tabindex="0" onkeydown="if(event.key=='Enter')rv('${d.id}')" onclick="rv('${d.id}')"><td>${esc(d.name)}</td><td>${esc(d.tname)}</td><td>${esc(sn(d.sid))}</td><td>${d.rv&&d.rv.ok?pill('Đã xác nhận','ok'):d.rv?pill('Đang soạn','wa'):pill('Chưa có','mu')}</td></tr>`).join('')}</table></div>${q.length>15?`<p class="note">Đang hiện 15/${q.length} hồ sơ; dùng bộ lọc ở trang Hồ sơ chuyên môn để xem thêm.</p>`:''}`:'<div class="empty">Chưa có hồ sơ ở trạng thái Đang rà soát. Tổ trưởng bấm “Bắt đầu rà soát” trong hồ sơ đã nộp.</div>'}</div>`}
function rv(id){const d=doc(id),r=d.rv||{c:[],ai:'',min:'',gem:'',wrong:'',note:'',ok:false},ed=role=='tt'&&d.st=='Đang rà soát',dis=ed?'':'disabled';
$('dlg').innerHTML=`<h2>Phiếu rà soát: ${esc(d.name)}</h2><p class="note">${esc(d.tname)} · ${esc(sn(d.sid))} · ${esc(d.to)}</p>${ed?'':'<p class="note">Chỉ tổ trưởng được ghi phiếu khi hồ sơ đang ở trạng thái Đang rà soát.</p>'}
<label for="r1">Có dùng AI: Có/Không</label><select id="r1" ${dis}>${opt([['','— Chọn —'],['Có','Có'],['Không','Không']],r.ai)}</select>
<label for="r2">Thời gian rà soát (phút)</label><input id="r2" type="number" min="0" max="600" value="${esc(r.min)}" ${dis}>
<label for="r3">Nhận xét của Gemini (dán vào; nếu không dùng AI thì để trống)</label><textarea id="r3" rows="5" ${dis}>${esc(r.gem)}</textarea>${ed?'<div class="bar"><button class="btn g" onclick="rvParse()">Điền 9 tiêu chí từ dòng KQ</button></div>':''}

<h3>Đánh giá theo 9 tiêu chí</h3>${CR.map((x,i)=>`<div class="cr"><span>${i+1}. ${esc(x[0])}</span><select id="c${i}" aria-label="Tiêu chí ${i+1}" ${dis}>${opt([['','—'],['d','Đạt'],['c','Chưa đạt'],['k','Không áp dụng']],r.c[i]||'')}</select></div>`).join('')}
<label for="r5">Nhận xét gửi giáo viên (tổ trưởng viết hoặc sửa lại)</label><textarea id="r5" rows="4" ${dis}>${esc(r.note)}</textarea>
${r.ok?`<p class="note">Đã xác nhận bởi ${esc(r.by)} lúc ${esc(r.at)}. Gửi giáo viên bằng thao tác “Yêu cầu chỉnh sửa” hoặc “Chuyển chờ duyệt” trong hồ sơ.</p>`:''}
<div class="bar" style="margin-top:12px"><span class="sp"></span><button class="btn g" onclick="$('dlg').close()">Đóng</button><button class="btn g" onclick="openDoc('${d.id}')">Mở hồ sơ</button>${ed?`<button class="btn g" onclick="rvSave('${d.id}',0)">Lưu nháp</button><button class="btn" onclick="rvSave('${d.id}',1)">Xác nhận đã đọc và sửa</button>`:''}</div>`;$('dlg').showModal()}
function rvSave(id,ok){const d=doc(id);if(role!='tt'||d.st!='Đang rà soát')return;const v=k=>$(k).value.trim(),c=CR.map((_,i)=>$('c'+i).value),r={ai:v('r1'),min:v('r2'),gem:v('r3'),wrong:v('r4'),note:v('r5'),c};
if(r.min!==''&&(isNaN(r.min)||+r.min<0||+r.min>600))return toast('Thời gian rà soát phải là số phút từ 0 đến 600',1);
if(r.wrong!==''&&(isNaN(r.wrong)||+r.wrong<0))return toast('Số nhận định AI sai phải là số không âm',1);
if(ok){if(!r.ai)return toast('Hãy chọn có dùng AI hay không',1);if(r.min==='')return toast('Hãy nhập thời gian rà soát (phút)',1);if(r.ai=='Có'&&(!r.gem||r.wrong===''))return toast('Có dùng AI: hãy dán nhận xét của Gemini và ghi số nhận định AI sai (có thể là 0)',1);if(d.ty==TY[0]&&c.includes(''))return toast('Hãy tích Đạt/Chưa đạt cho cả 9 tiêu chí',1)}
d.rv=Object.assign(r,{ver:d.ver.length,ok:!!ok,by:ME().n,at:nowTs()});if(ok)d.log.push({at:nowTs(),by:ME().n+' ('+ME().l+')',act:'Xác nhận phiếu rà soát (Có dùng AI: '+r.ai+', '+r.min+' phút)',note:''});
aud((ok?'Xác nhận':'Lưu nháp')+' phiếu rà soát: '+d.name);save();$('dlg').close();render();toast(ok?'Đã xác nhận phiếu rà soát':'Đã lưu nháp phiếu')}

const EV={sh:{t:'Sinh hoạt chuyên môn',ST:['Kế hoạch','Đã diễn ra','Đã có biên bản'],F:[['title','Nội dung sinh hoạt','i'],['date','Ngày giờ','dt'],['place','Địa điểm','i'],['att','Thành phần tham dự','i'],['goal','Mục tiêu','t'],['concl','Kết luận và biên bản','t'],['follow','Nhiệm vụ sau buổi sinh hoạt (người phụ trách, hạn)','t']]},dg:{t:'Dự giờ',ST:['Kế hoạch','Đã dự giờ','Đã trao đổi sau dự giờ'],F:[['teacher','Giáo viên được dự giờ','i'],['obs','Người dự giờ','i'],['subj','Môn học, lớp','i'],['date','Ngày dự giờ','d'],['pro','Điểm mạnh','t'],['imp','Điểm cần điều chỉnh','t'],['sup','Đề xuất hỗ trợ và minh chứng','t'],['follow','Trao đổi và theo dõi sau dự giờ','t']]}};

if(e)Object.assign(e,n);else D.events.push(Object.assign({id:uid('SK',D.events,3)},n));aud('Lưu '+c.t+': '+n[c.F[0][0]]);save();$('dlg').close();render();toast('Đã lưu')}
function usr(){if(role!='bgh'&&role!='ad')return empty('Quản lý người dùng','Chỉ Ban giám hiệu và Quản trị viên được quản lý danh sách giáo viên. Chưa có đăng nhập; vai trò chỉ để xem thử.');
const q=(hf.tq||'').toLowerCase(),a=D.teachers.filter(t=>!q||(t.name+t.id).toLowerCase().includes(q)),l=a.slice(0,50);
return`<div class="bar"><input id="q" placeholder="Tìm theo tên hoặc mã giáo viên" value="${esc(hf.tq||'')}" oninput="hf.tq=this.value;render(1)" aria-label="Tìm giáo viên"><span class="sp"></span><button class="btn g" onclick="expT()">Xuất danh sách (CSV)</button><button class="btn g" onclick="impForm()">Nhập danh sách (CSV)</button><button class="btn" onclick="tForm()">+ Thêm giáo viên</button></div><div class="card"><div class="tw"><table><tr><th>Mã</th><th>Họ tên</th><th>Tổ</th><th>Điểm trường</th><th>Hồ sơ</th><th>Trạng thái</th></tr>${l.map(t=>`<tr class="cl" tabindex="0" onkeydown="if(event.key=='Enter')tForm('${t.id}')" onclick="tForm('${t.id}')"><td>${t.id}</td><td>${esc(t.name)}</td><td>${esc(t.to)}</td><td>${esc(sn(t.sid))}</td><td>${D.docs.filter(d=>d.tid==t.id).length}</td><td>${t.active===false?pill('Ngừng','er'):pill('Đang công tác','ok')}</td></tr>`).join('')}</table></div><p class="note">Hiện ${l.length}/${a.length} giáo viên (tối đa 50 dòng; dùng ô tìm kiếm để thu hẹp). Danh sách này là dữ liệu mẫu cho đến khi nhập danh sách thật. Chưa có tài khoản đăng nhập.</p></div>`}
function tForm(id){const t=D.teachers.find(x=>x.id==id)||{name:'',to:TO[0],sid:D.schools[0].id,active:true};
$('dlg').innerHTML=`<h2>${id?'Sửa':'Thêm'} giáo viên</h2><label for="t1">Họ tên</label><input id="t1" value="${esc(t.name)}"><label for="t2">Tổ chuyên môn</label><select id="t2">${opt(TO.map(x=>[x,x]),t.to)}</select><label for="t3">Điểm trường</label><select id="t3">${opt(D.schools.filter(s=>s.active||s.id==t.sid).map(s=>[s.id,s.name]),t.sid)}</select><label for="t4">Trạng thái công tác</label><select id="t4">${opt([['1','Đang công tác'],['0','Ngừng']],t.active===false?'0':'1')}</select><p class="note">Chuyển tổ hoặc điểm trường không làm mất hồ sơ cũ: mỗi hồ sơ giữ tổ và điểm trường tại thời điểm nộp.</p><div class="bar"><span class="sp"></span><button class="btn g" onclick="$('dlg').close()">Hủy</button><button class="btn" onclick="tSave('${id||''}')">Lưu</button></div>`;$('dlg').showModal()}
function tSave(id){const n=$('t1').value.trim();if(!n)return toast('Hãy nhập họ tên',1);const o={name:n,to:$('t2').value,sid:$('t3').value,active:$('t4').value=='1'};
if(D.teachers.some(x=>x.id!=id&&x.name.toLowerCase()==n.toLowerCase()&&x.sid==o.sid&&x.to==o.to))return toast('Đã có giáo viên trùng họ tên, tổ và điểm trường',1);
const t=D.teachers.find(x=>x.id==id);if(t){const ch=t.to!=o.to||t.sid!=o.sid;Object.assign(t,o);aud('Sửa giáo viên: '+n+(ch?' (chuyển tổ/điểm trường)':''))}else{D.teachers.push(Object.assign({id:uid('GV',D.teachers,3)},o));aud('Thêm giáo viên: '+n)}save();$('dlg').close();render();toast('Đã lưu giáo viên')}
function impForm(){$('dlg').innerHTML=`<h2>Nhập danh sách giáo viên</h2><p class="note">Mỗi dòng một giáo viên: Họ tên; Tổ; Mã điểm trường. Dòng trùng họ tên-tổ-điểm trường, sai tên tổ hoặc sai mã điểm trường sẽ bị bỏ qua và được báo lại.</p><textarea id="im" rows="8" placeholder="Nguyễn Văn A;${esc(TO[0])};${esc(D.schools[0].code)}"></textarea><input id="imf" type="file" accept=".csv,.txt" onchange="const f=this.files[0];if(f&&f.size<2e6){const r=new FileReader();r.onload=()=>$('im').value=r.result;r.readAsText(f)}"><div class="bar" style="margin-top:12px"><span class="sp"></span><button class="btn g" onclick="$('dlg').close()">Hủy</button><button class="btn" onclick="impDo()">Nhập</button></div>`;$('dlg').showModal()}
function impDo(){const L=$('im').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),bad=[];let ok=0;L.forEach((ln,i)=>{const[n,to,cd]=ln.split(/[;\t,]/).map(x=>x.trim()),s=D.schools.find(x=>x.code.toLowerCase()==(cd||'').toLowerCase());if(i==0&&/họ tên/i.test(n))return;
if(!n||!TO.includes(to)||!s||D.teachers.some(x=>x.name.toLowerCase()==n.toLowerCase()&&x.sid==s.id&&x.to==to)){bad.push(i+1);return}
D.teachers.push({id:uid('GV',D.teachers,3),name:n,to,sid:s.id,active:true});ok++});aud('Nhập danh sách giáo viên: '+ok+' dòng hợp lệ');save();$('dlg').close();render();toast('Đã nhập '+ok+' giáo viên'+(bad.length?'; bỏ qua dòng '+bad.slice(0,10).join(', '):''),!ok)}
const MH=()=>D.mode=='that'?'':' · số liệu minh hoạ';
function errCard(){return`<div class="card"><h2>Dữ liệu đã lưu bị lỗi, chưa bị ghi đè</h2><p>${esc(LOADERR)}</p><p>Bản gốc vẫn nằm nguyên trong trình duyệt (và có một bản sao ở khóa edm-corrupt). Ứng dụng đang tạm hiển thị dữ liệu mẫu và <b>không lưu</b> thay đổi cho đến khi bạn chọn cách xử lý:</p><div class="bar"><button class="btn g" onclick="dl('du-lieu-loi.json',RAW||'','application/json')">Tải bản gốc bị lỗi</button><label class="btn g" style="display:inline-block;margin:0">Khôi phục từ tệp sao lưu<input type="file" accept=".json,application/json" hidden onchange="restore(this)"></label><button class="btn g" onclick="resetData()">Bỏ dữ liệu lỗi, bắt đầu bằng dữ liệu mẫu</button></div></div>`}
function csvOut(name,rows){const q=a=>a.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');return dl(name,'\uFEFF'+q([['Xuất lúc '+nowTs()+' · '+(D.mode=='that'?'dữ liệu thật':'dữ liệu mẫu')],...rows]),'text/csv;charset=utf-8')?toast('Đã tạo tệp '+name):toast('Trình duyệt không tạo được tệp',1)}
function expT(){csvOut('giao-vien.csv',[['Mã','Họ tên','Tổ','Điểm trường','Trạng thái'],...D.teachers.map(t=>[t.id,t.name,t.to,sn(t.sid),t.active===false?'Ngừng':'Đang công tác'])])}
function expE(k){csvOut(k=='sh'?'sinh-hoat.csv':'du-gio.csv',[['Mã',...EV[k].F.map(f=>f[1]),'Điểm trường','Tổ','Trạng thái'],...evList(k).map(e=>[e.id,...EV[k].F.map(f=>e[f[0]]||''),sn(e.sid),e.to,e.st])])}
function startReal(){ask('Chuyển sang dữ liệu thật: xóa toàn bộ giáo viên, hồ sơ, nhiệm vụ, sinh hoạt, dự giờ và phiếu mẫu hiện có, chỉ giữ các điểm trường. Hệ thống giữ một bản trước khi xóa, nhưng bạn nên tải bản sao lưu trước. Tiếp tục?',()=>{prev();D={v:3,mode:'that',events:[],pilot:{},upd:nowTs(),schools:D.schools.map(s=>({...s,pt:'',hist:[{at:TODAY,by:ME().n,act:'Bắt đầu dùng dữ liệu thật'}]})),teachers:[],docs:[],tasks:[],audit:[]};selId=null;aud('Bắt đầu dùng dữ liệu thật');save();render();toast('Đã chuyển sang dữ liệu thật. Hãy thêm giáo viên ở mục Quản lý người dùng.')})}
const ICN=['🏫','👩‍🏫','📁','📤','📥','🔍','✏️','✅','⏳','📌','📊','🎯','🧾','⚠️'];
const heroC=()=>`<div class="hero"><b>Xin chào, ${esc(ME().n)}</b><small>${esc(ME().l)} · Năm học 2026–2027 · Học kỳ I · tuần T${CW} · ${D.mode=='that'?'dữ liệu thật':'dữ liệu mẫu'}</small></div>`;
const buildPR=()=>PR.replace('[điền]',($('pm')||{}).value||'[điền]').replace('[Có / Không]',($('ph')||{}).value||'[Có / Không]').replace('[Đã dạy / Chưa dạy]',($('pd')||{}).value||'[Đã dạy / Chưa dạy]');
const pu=()=>{const t=$('pt');if(t)t.value=buildPR()};
function rvParse(){const t=$('r3').value,i=t.lastIndexOf('KQ:');if(i<0)return toast('Không thấy dòng “KQ:” trong nhận xét đã dán',1);const mp={'Đ':'d','C':'c','K':'k'},o={},re=/(\d)\s*=\s*([ĐCKđck])/g,ln=t.slice(i).split('\n')[0];let m;while((m=re.exec(ln)))o[m[1]]=mp[m[2].toUpperCase()];
if(Object.keys(o).length!=9||!CR.every((_,j)=>o[j+1]))return toast('Dòng KQ phải đủ 9 tiêu chí (1–9), mỗi tiêu chí là Đ, C hoặc K',1);CR.forEach((_,j)=>$('c'+j).value=o[j+1]);toast('Đã điền 9 tiêu chí từ dòng KQ. Tổ trưởng đọc lại và sửa trước khi xác nhận.')}
function cfg(){return`<div class="card"><h2>Thông tin hệ thống</h2><p>Trường Tiểu học Đỗ Thúc Tịnh · Năm học 2026–2027 · Học kỳ I · ${D.schools.length} điểm trường</p><p class="note">Dữ liệu (${D.mode=='that'?'thật':'mẫu'}) chỉ được lưu trong trình duyệt và thiết bị này${persistOK?'':' (hiện không lưu được, dữ liệu sẽ mất khi tải lại trang)'}. Không dùng cho dữ liệu học sinh hoặc dữ liệu nhạy cảm.</p>${role=='ad'?'<button class="btn g" onclick="backup()">Tải bản sao lưu (JSON)</button> <label class="btn g" style="display:inline-block;margin:0">Khôi phục từ tệp<input type="file" accept=".json,application/json" hidden onchange="restore(this)"></label> <button class="btn g" onclick="resetData()">Đặt lại dữ liệu mẫu</button> <button class="btn" onclick="startReal()">Bắt đầu dùng dữ liệu thật</button>':''}</div><div class="card"><h2>Nhật ký thao tác</h2>${D.audit.length?`<div class="tw"><table><tr><th>Thời điểm</th><th>Người thực hiện</th><th>Thao tác</th></tr>${D.audit.slice(0,30).map(a=>`<tr><td>${a.at}</td><td>${esc(a.by)} (${esc(a.role)})</td><td>${esc(a.act)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Chưa có thao tác nào được ghi nhận.</div>'}</div>`}
function resetData(){ask('Đặt lại toàn bộ dữ liệu về dữ liệu mẫu ban đầu? Thao tác này không hoàn tác được.',()=>{if(!LOADERR)prev();try{localStorage.removeItem(KEY)}catch(e){}LOADERR='';D=seed();selId=null;aud('Đặt lại dữ liệu mẫu');save();render();toast('Đã đặt lại dữ liệu mẫu')})}
function dl(name,text,type){try{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}}
function copyCsv(k){const q=a=>a.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),sc=`Phạm vi: ${fl.sid?sn(fl.sid):'mọi điểm trường'}; ${fl.to||'mọi tổ'}; tháng ${fl.mo||'mọi'}; hạn từ ${fl.df||'—'} đến ${fl.dt||'—'}${k=='h'?'; trạng thái '+(hf.st||'mọi'):''}; xuất lúc ${nowTs()}`;
const a=k=='h'?[['Mã','Tên','Loại','Người nộp','Điểm trường','Tổ','Hạn','Trạng thái','Quá hạn','Số phiên bản'],...hdocs().map(d=>[d.id,d.name,d.ty,d.tname,sn(d.sid),d.to,d.due||'',d.st,odDoc(d)?'Có':'Không',d.ver.length])]:[['Điểm trường','Giáo viên','Hồ sơ cần nộp','Đã nộp','Chờ duyệt','Đã duyệt','Cần chỉnh sửa','Hồ sơ quá hạn','Nhiệm vụ quá hạn'],...rows().map(r=>[r.s.name,r.gv,r.st.n,r.st.sub,r.st.wait,r.st.ap,r.st.fix,r.st.od,r.od])];
if(dl(k=='h'?'ho-so.csv':'tong-hop.csv','\uFEFF'+q([[sc],...a]),'text/csv;charset=utf-8'))toast('Đã tạo tệp CSV ('+(a.length-1)+' dòng)');else toast('Trình duyệt không tạo được tệp CSV',1)}
function backup(){dl('edumanage-v5-'+TODAY+'.json',JSON.stringify(D,null,1),'application/json')?toast('Đã tạo tệp sao lưu'):toast('Trình duyệt không tạo được tệp sao lưu',1)}
function restore(i){const f=i.files[0];if(!f)return;if(f.size>5e6)return toast('Tệp quá lớn (tối đa 5 MB)',1);const r=new FileReader();r.onerror=()=>toast('Không đọc được tệp',1);r.onload=()=>{let x;try{x=migrate(JSON.parse(r.result))}catch(e){return toast('Tệp không phải JSON hợp lệ',1)}const er=validate(x);if(er)return toast('Không khôi phục: '+er,1);ask('Thay toàn bộ dữ liệu hiện tại bằng dữ liệu trong tệp '+f.name+'? Nên tải bản sao lưu hiện tại trước; hệ thống cũng giữ một bản trước khi thay.',()=>{if(!LOADERR)prev();D=x;LOADERR='';selId=null;aud('Khôi phục dữ liệu từ tệp sao lưu');save();render();toast('Đã khôi phục dữ liệu')})};r.readAsText(f);i.value=''}
function notes(){const L=[],w=cnt(D.docs,'Chờ duyệt'),o=D.tasks.filter(t=>overdue(t)&&(role!='gv'||t.sid=='all'||t.sid==gvSid())).length,f=D.docs.filter(d=>d.st=='Cần chỉnh sửa'&&d.tid==R.gv.tid).length;
if(role=='bgh'&&w)L.push([`${w} hồ sơ chờ BGH phê duyệt`,"hf.st='Chờ duyệt';hf.ty='';go(3)"]);if(role=='tt'){const n=D.docs.filter(d=>d.st=='Đã nộp'&&d.to==ttTo).length;if(n)L.push([n+' hồ sơ đã nộp chờ tiếp nhận rà soát',"hf.st='Đã nộp';hf.ty='';go(3)"])}if(o)L.push([`${o} nhiệm vụ quá hạn`,'go(2)']);if(role=='gv'&&f)L.push([`${f} hồ sơ của bạn cần chỉnh sửa`,"hf.st='Cần chỉnh sửa';hf.ty='';go(3)"]);return L}
function bell(){const L=notes();
$('dlg').innerHTML=`<h2>Thông báo</h2>${L.length?`<ul>${L.map(x=>`<li><a class="l" onclick="$('dlg').close();${x[1]}">${x[0]}</a></li>`).join('')}</ul>`:'<p class="note">Không có thông báo mới.</p>'}<div class="bar"><span class="sp"></span><button class="btn g" onclick="$('dlg').close()">Đóng</button></div>`;$('dlg').showModal()}
/* Điều hướng */

const LB={};GR.forEach(g=>g[1].forEach(i=>LB[i[0]]=i[2]));
const VW={0:dash,1:truong,2:nv,3:hoso,4:ai,5:()=>ev('sh'),6:()=>ev('dg'),7:bc,8:tc,9:usr,10:cfg};
function nav(i){cur=i;selId=null;hf.pg=1;hf.q='';if([3,5,6].includes(i)){hf.st='';hf.ty=i==5?TY[2]:i==6?TY[3]:''}render()}

$('v').innerHTML=LOADERR?errCard():`<h2>${LB[cur]}</h2>`+VW[cur]();const m=ME();$('un').textContent=m.n;$('ul').textContent=m.l;$('av').textContent=m.av||m.n.trim().split(' ').pop()[0].toUpperCase();$('tt2').style.display=role=='tt'?'':'none';$('tt2').innerHTML=opt(TO.map(x=>[x,x]),ttTo);
$('rl').value=role;$('bc').textContent=notes().length||'';$('ban').textContent='V5 · '+(D.mode=='that'?'DỮ LIỆU THẬT':'DỮ LIỆU MẪU (số liệu minh hoạ)')+', chỉ lưu trên trình duyệt và thiết bị này. Chưa có đăng nhập hay máy chủ; web không tự gọi AI, việc rà soát có AI thực hiện trong Gemini của trường. Vai trò phía trên chỉ để xem thử, không phải xác thực.'+(persistOK?'':' Trình duyệt không cho lưu dữ liệu, thay đổi sẽ mất khi tải lại.');
if(keep){const q=$('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
try{const t=localStorage.getItem('edm-theme');if(t)document.documentElement.dataset.theme=t;if(localStorage.getItem('edm-sb'))document.querySelector('.app').classList.add('sc')}catch(e){}
save();render();
